<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tirupati Auto Fleet{% endblock %}</title>
  <meta name="description" content="Find a free auto-rickshaw at Alipiri, Tirumala Bus Stand or Tirupati Railway Station and call the driver directly.">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="44" height="44">
        <span class="brand-name">Tirupati Auto Fleet<small>Tirupati and Tirumala</small></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('index') }}#book">Book a ride</a>
        <a href="{{ url_for('index') }}#stands">Stands</a>
        <a href="{{ url_for('index') }}#join">Join as driver</a>
        <a class="nav-fleet" href="{{ url_for('fleet') }}">Fleet desk</a>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <div class="wrap foot">
      <div class="brand brand-foot">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" width="40" height="40">
        <span class="brand-name">Tirupati Auto Fleet</span>
      </div>
      <p>An independent auto-rickshaw dispatch service for pilgrims and residents. Not affiliated with Tirumala Tirupati Devasthanams.</p>
      <p class="copy">&copy; 2026 Tirupati Auto Fleet</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
